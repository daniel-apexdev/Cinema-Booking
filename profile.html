<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>My Profile — Savannah Cinemas</title>
    <meta name="theme-color" content="#14141C">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Oswald:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #14141C; --ink-raised: #1D1D28; --ink-line: #2C2C3A;
            --paper: #F2EFE9; --paper-dim: #B9B6AC;
            --gold: #E8B34C; --gold-dim: #7A5C22;
            --rust: #B33951; --success: #4C9A6A;
            --font-display: 'Oswald', Impact, sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;
            --radius-sm: 8px; --radius-md: 14px; --radius-lg: 20px;
            --container-padding: clamp(16px, 4vw, 60px);
            --container-max-width: 1200px;
            --touch-target: 44px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { background: var(--ink); color: var(--paper); font-family: var(--font-body); font-size: 15px; line-height: 1.6; min-height: 100vh; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        a { color: inherit; text-decoration: none; }
        button { cursor: pointer; border: none; background: none; color: inherit; font-family: inherit; }
        ::selection { background: var(--gold); color: var(--ink); }

        .nav { display: flex; align-items: center; justify-content: space-between; padding: 12px var(--container-padding); border-bottom: 1px solid var(--ink-line); background: rgba(20,20,28,0.92); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100; gap: 12px; min-height: 64px; }
        .nav-left { display: flex; align-items: center; gap: 12px; }
        .nav-brand { font-family: var(--font-display); font-size: clamp(18px, 2.4vw, 24px); font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
        .nav-brand span { color: var(--gold); }
        .nav-links { display: flex; gap: clamp(12px, 2vw, 32px); list-style: none; }
        .nav-links a { color: var(--paper-dim); font-size: clamp(12px, 0.9vw, 14px); transition: 0.3s ease; white-space: nowrap; }
        .nav-links a:hover, .nav-links a.active { color: var(--gold); }
        .nav-right { display: flex; align-items: center; gap: 12px; z-index: 1001; position: relative; }
        .btn-signin { padding: 8px 18px; background: var(--gold); color: var(--ink); border-radius: var(--radius-sm); font-size: clamp(12px, 0.8vw, 14px); font-weight: 500; min-height: 38px; display: inline-flex; align-items: center; gap: 6px; }

        .menu-toggle { display: none; flex-direction: column; gap: 5px; padding: 8px 6px; min-width: var(--touch-target); min-height: var(--touch-target); justify-content: center; align-items: center; border-radius: var(--radius-sm); }
        .menu-toggle span { display: block; width: 24px; height: 2.5px; background: var(--paper); transition: 0.3s ease; border-radius: 2px; transform-origin: center; }
        .menu-toggle.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .menu-toggle.active span:nth-child(2) { opacity: 0; }
        .menu-toggle.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

        .mobile-menu-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 999; opacity: 0; transition: opacity 0.3s ease; }
        .mobile-menu-overlay.active { display: block; opacity: 1; }
        .mobile-menu { position: fixed; top: 0; left: -100%; width: 85%; max-width: 380px; height: 100vh; background: var(--ink); z-index: 1000; transition: left 0.4s cubic-bezier(0.4,0,0.2,1); overflow-y: auto; box-shadow: 8px 0 40px rgba(0,0,0,0.6); border-right: 1px solid var(--ink-line); display: flex; flex-direction: column; }
        .mobile-menu.open { left: 0; }
        .mobile-menu-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--ink-line); background: var(--ink-raised); }
        .mobile-menu-brand { font-family: var(--font-display); font-size: 18px; font-weight: 500; text-transform: uppercase; }
        .mobile-menu-brand span { color: var(--gold); }
        .mobile-menu-close { padding: 10px; min-width: var(--touch-target); min-height: var(--touch-target); display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .mobile-menu-links { list-style: none; padding: 8px 0; flex: 1; }
        .mobile-menu-links li { padding: 0 16px; margin: 2px 0; }
        .mobile-menu-links a { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 10px; min-height: var(--touch-target); }
        .mobile-menu-links a i { width: 24px; text-align: center; color: var(--paper-dim); }
        .mobile-menu-links a:hover { color: var(--gold); background: rgba(232,179,76,0.06); }
        .mobile-menu-footer { padding: 14px 20px; border-top: 1px solid var(--ink-line); text-align: center; font-family: var(--font-mono); font-size: 11px; color: var(--paper-dim); margin-top: auto; }

        /* LAYOUT */
        .profile-section { max-width: var(--container-max-width); margin: 0 auto; padding: 50px var(--container-padding); }

        /* HEADER CARD */
        .profile-header {
            background: linear-gradient(135deg, rgba(232,179,76,0.12) 0%, rgba(179,57,81,0.06) 100%);
            border: 1px solid var(--ink-line);
            border-radius: var(--radius-lg);
            padding: 40px;
            margin-bottom: 40px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 30px;
            align-items: center;
        }
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--gold);
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-size: 40px;
            font-weight: 500;
            flex-shrink: 0;
            box-shadow: 0 10px 40px rgba(232,179,76,0.4);
        }
        .profile-info { min-width: 0; }
        .profile-name {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 6px;
        }
        .profile-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            color: var(--paper-dim);
            font-size: 13px;
        }
        .profile-meta-item { display: flex; align-items: center; gap: 6px; }
        .profile-meta-item i { color: var(--gold); }
        .profile-member-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(232,179,76,0.15);
            border: 1px solid var(--gold-dim);
            border-radius: 100px;
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--gold);
        }

        .btn-logout {
            padding: 10px 20px;
            border: 1px solid var(--rust);
            border-radius: var(--radius-sm);
            background: rgba(179,57,81,0.1);
            color: #F48FB1;
            font-size: 13px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s ease;
        }
        .btn-logout:hover { background: var(--rust); color: white; }

        /* STATS */
        .profile-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 40px;
        }
        .stat-card {
            padding: 24px;
            background: var(--ink-raised);
            border: 1px solid var(--ink-line);
            border-radius: var(--radius-md);
            text-align: center;
        }
        .stat-card-value {
            font-family: var(--font-display);
            font-size: 32px;
            font-weight: 500;
            color: var(--gold);
            line-height: 1;
            margin-bottom: 8px;
        }
        .stat-card-label {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--paper-dim);
        }

        /* TABS */
        .profile-tabs {
            display: flex;
            gap: 4px;
            padding: 4px;
            background: var(--ink-raised);
            border: 1px solid var(--ink-line);
            border-radius: var(--radius-md);
            margin-bottom: 30px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .profile-tab {
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            color: var(--paper-dim);
            transition: 0.3s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .profile-tab:hover { color: var(--paper); }
        .profile-tab.active { background: var(--gold); color: var(--ink); }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* BOOKINGS */
        .bookings-list { display: flex; flex-direction: column; gap: 14px; }
        .booking-row {
            display: grid;
            grid-template-columns: 80px 1fr auto;
            gap: 20px;
            align-items: center;
            padding: 20px;
            background: var(--ink-raised);
            border: 1px solid var(--ink-line);
            border-radius: var(--radius-md);
            transition: 0.3s ease;
        }
        .booking-row:hover { border-color: var(--gold-dim); }
        .booking-poster {
            width: 80px;
            height: 120px;
            border-radius: 8px;
            object-fit: cover;
            background: var(--ink);
        }
        .booking-info { min-width: 0; }
        .booking-title {
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        .booking-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 12px;
            color: var(--paper-dim);
        }
        .booking-meta-item { display: flex; align-items: center; gap: 8px; }
        .booking-meta-item i { color: var(--gold); width: 12px; }
        .booking-ref {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.08em;
            color: var(--gold);
            padding: 3px 8px;
            background: rgba(232,179,76,0.1);
            border-radius: 4px;
            display: inline-block;
            margin-top: 6px;
        }
        .booking-status {
            padding: 6px 14px;
            border-radius: 100px;
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 500;
        }
        .booking-status.upcoming { background: rgba(76,154,106,0.15); color: #A5D6A7; border: 1px solid rgba(76,154,106,0.3); }
        .booking-status.past { background: rgba(255,255,255,0.05); color: var(--paper-dim); border: 1px solid var(--ink-line); }
        .booking-status.cancelled { background: rgba(179,57,81,0.15); color: #F48FB1; border: 1px solid rgba(179,57,81,0.3); }

        .empty-tab {
            padding: 60px 20px;
            text-align: center;
            color: var(--paper-dim);
        }
        .empty-tab i {
            font-size: 48px;
            color: var(--gold-dim);
            display: block;
            margin-bottom: 16px;
        }
        .empty-tab h3 {
            font-family: var(--font-display);
            font-size: 20px;
            color: var(--paper);
            margin-bottom: 8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-weight: 500;
            font-size: 14px;
            transition: 0.3s ease;
            min-height: 44px;
        }
        .btn-primary { background: var(--gold); color: var(--ink); }
        .btn-primary:hover { background: #F0C369; transform: translateY(-2px); }
        .btn-ghost { background: transparent; color: var(--paper); border: 1px solid var(--ink-line); }
        .btn-ghost:hover { border-color: var(--gold); color: var(--gold); }

        /* SETTINGS */
        .settings-group {
            background: var(--ink-raised);
            border: 1px solid var(--ink-line);
            border-radius: var(--radius-md);
            padding: 24px;
            margin-bottom: 20px;
        }
        .settings-group-title {
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--ink-line);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .settings-group-title i { color: var(--gold); font-size: 14px; }

        .settings-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--ink-line);
        }
        .settings-row:last-child { border-bottom: none; padding-bottom: 0; }
        .settings-row:first-of-type { padding-top: 0; }
        .settings-label { font-size: 14px; }
        .settings-sublabel { font-size: 12px; color: var(--paper-dim); margin-top: 2px; }
        .settings-value { font-family: var(--font-mono); font-size: 13px; color: var(--gold); }

        /* TOAST */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .footer { max-width: var(--container-max-width); margin: 60px auto 0; padding: 40px var(--container-padding) 0; border-top: 1px solid var(--ink-line); }
        .footer-bottom { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; padding: 16px 0 24px; font-family: var(--font-mono); font-size: 11px; color: var(--paper-dim); }
        .footer-bottom .legal a { color: var(--paper-dim); margin-left: 16px; }

        @media (max-width: 900px) {
            .menu-toggle { display: flex; }
            .nav-links { display: none; }
            .profile-header { grid-template-columns: 1fr; text-align: center; gap: 20px; }
            .profile-avatar { margin: 0 auto; }
            .profile-meta { justify-content: center; }
            .profile-stats { grid-template-columns: 1fr 1fr; }
            .booking-row { grid-template-columns: 60px 1fr; gap: 14px; }
            .booking-poster { width: 60px; height: 90px; }
            .booking-status { grid-column: 1 / -1; justify-self: start; }
        }
        @media (max-width: 640px) {
            .profile-section { padding: 30px var(--container-padding); }
            .profile-header { padding: 24px; }
            .profile-name { font-size: 22px; }
            .profile-avatar { width: 80px; height: 80px; font-size: 32px; }
            .stat-card-value { font-size: 24px; }
            .settings-row { grid-template-columns: 1fr; }
            .footer-bottom { flex-direction: column; text-align: center; }
            .footer-bottom .legal a { margin: 0 8px; }
        }
    </style>
</head>
<body>

<nav class="nav">
    <div class="nav-left">
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
            <span></span><span></span><span></span>
        </button>
        <a href="index.html" class="nav-brand">Savannah <span>Cinemas</span></a>
    </div>
    <ul class="nav-links">
        <li><a href="index.html">Now Showing</a></li>
        <li><a href="coming-soon.html">Coming Soon</a></li>
        <li><a href="cinemas.html">Cinemas</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="offers.html">Offers</a></li>
    </ul>
    <div class="nav-right">
        <div id="navUser"></div>
    </div>
</nav>

<div class="mobile-menu-overlay" id="mobileOverlay"></div>
<aside class="mobile-menu" id="mobileMenu" aria-hidden="true">
    <div class="mobile-menu-header">
        <div class="mobile-menu-brand">Savannah <span>Cinemas</span></div>
        <button class="mobile-menu-close" id="mobileMenuClose"><i class="fas fa-times"></i></button>
    </div>
    <ul class="mobile-menu-links">
        <li><a href="index.html"><i class="fas fa-film"></i> Now Showing</a></li>
        <li><a href="coming-soon.html"><i class="fas fa-calendar-alt"></i> Coming Soon</a></li>
        <li><a href="cinemas.html"><i class="fas fa-map-marker-alt"></i> Cinemas</a></li>
        <li><a href="events.html"><i class="fas fa-star"></i> Events</a></li>
        <li><a href="offers.html"><i class="fas fa-tags"></i> Offers</a></li>
        <li><a href="about.html"><i class="fas fa-info-circle"></i> About</a></li>
    </ul>
    <div class="mobile-menu-footer"><p>© 2026 Savannah Cinemas</p></div>
</aside>

<section class="profile-section" id="profileSection">
    <!-- Populated by JS -->
</section>

<footer class="footer">
    <div class="footer-bottom">
        <span>© 2026 Savannah Cinemas</span>
        <span class="legal">
            <a href="privacy.html">Privacy</a>
            <a href="terms.html">Terms</a>
            <a href="accessibility.html">Accessibility</a>
        </span>
    </div>
</footer>

<script src="data/movies-inline.js"></script>
<script src="js/app.js"></script>
<script src="js/storage.js"></script>

<script>
const ProfilePage = {
    user: null,
    bookingHistory: [],

    async init() {
        await SavannahApp.init();
        this.setupMobileMenu();

        this.user = SavannahStorage.getUser();
        if (!this.user) {
            window.location.href = 'login.html?redirect=profile.html';
            return;
        }

        this.bookingHistory = SavannahStorage.get(SavannahStorage.KEYS.BOOKING_HISTORY, []);
        this.renderNavUser();
        this.render();
        this.setupTabs();
    },

    setupMobileMenu() {
        const toggle = document.getElementById('menuToggle');
        const menu = document.getElementById('mobileMenu');
        const overlay = document.getElementById('mobileOverlay');
        const closeBtn = document.getElementById('mobileMenuClose');
        const open = () => { menu.classList.add('open'); overlay.classList.add('active'); toggle.classList.add('active'); document.body.style.overflow = 'hidden'; };
        const close = () => { menu.classList.remove('open'); overlay.classList.remove('active'); toggle.classList.remove('active'); document.body.style.overflow = ''; };
        toggle?.addEventListener('click', () => menu.classList.contains('open') ? close() : open());
        closeBtn?.addEventListener('click', close);
        overlay?.addEventListener('click', close);
    },

    renderNavUser() {
        const navUser = document.getElementById('navUser');
        const u = this.user;
        const initials = ((u.forenames || u.name || 'U').substring(0, 1) + (u.surname ? u.surname.substring(0, 1) : '')).toUpperCase();

        navUser.innerHTML = `
            <div style="display:flex;align-items:center;gap:10px;">
                <div style="width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:500;font-size:13px;">${initials}</div>
            </div>
        `;
    },

    render() {
        const u = this.user;
        const initials = ((u.forenames || u.name || 'U').substring(0, 1) + (u.surname ? u.surname.substring(0, 1) : '')).toUpperCase();
        const displayName = u.name || `${u.forenames || ''} ${u.surname || ''}`.trim() || 'Guest';

        // Compute stats
        const upcoming = this.bookingHistory.filter(b => new Date(b.showtimeDate) >= new Date()).length;
        const watched = this.bookingHistory.filter(b => new Date(b.showtimeDate) < new Date()).length;
        const totalSpent = this.bookingHistory.reduce((sum, b) => sum + (parseFloat(b.totalAmountRaw) || 0), 0);

        document.getElementById('profileSection').innerHTML = `
            <!-- HEADER -->
            <div class="profile-header">
                <div class="profile-avatar">${initials}</div>
                <div class="profile-info">
                    <div class="profile-name">${displayName}</div>
                    <div class="profile-meta">
                        <span class="profile-meta-item"><i class="fas fa-envelope"></i> ${u.email || '—'}</span>
                        ${u.phone ? `<span class="profile-meta-item"><i class="fas fa-phone"></i> ${u.phone}</span>` : ''}
                    </div>
                    <div style="margin-top:12px;">
                        <span class="profile-member-badge">
                            <i class="fas fa-star"></i> Bronze Member
                        </span>
                    </div>
                </div>
                <div>
                    <button class="btn-logout" onclick="ProfilePage.logout()">
                        <i class="fas fa-sign-out-alt"></i> Sign Out
                    </button>
                </div>
            </div>

            <!-- STATS -->
            <div class="profile-stats">
                <div class="stat-card">
                    <div class="stat-card-value">${upcoming}</div>
                    <div class="stat-card-label">Upcoming</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-value">${watched}</div>
                    <div class="stat-card-label">Watched</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-value">0</div>
                    <div class="stat-card-label">Loyalty Points</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-value">${SavannahApp.formatCurrency(totalSpent)}</div>
                    <div class="stat-card-label">Total Spent</div>
                </div>
            </div>

            <!-- TABS -->
            <div class="profile-tabs">
                <button class="profile-tab active" data-tab="bookings">My Bookings</button>
                <button class="profile-tab" data-tab="watchlist">Watchlist</button>
                <button class="profile-tab" data-tab="settings">Settings</button>
            </div>

            <!-- BOOKINGS -->
            <div class="tab-panel active" id="bookingsPanel">
                ${this.renderBookings()}
            </div>

            <!-- WATCHLIST -->
            <div class="tab-panel" id="watchlistPanel">
                <div class="empty-tab">
                    <i class="fas fa-bookmark"></i>
                    <h3>No saved films yet</h3>
                    <p>Browse movies and tap the bookmark icon to save them here.</p>
                    <a href="index.html" class="btn btn-primary" style="display:inline-flex;margin-top:20px;">
                        <i class="fas fa-film"></i> Browse Movies
                    </a>
                </div>
            </div>

            <!-- SETTINGS -->
            <div class="tab-panel" id="settingsPanel">
                ${this.renderSettings()}
            </div>
        `;
    },

    renderBookings() {
        if (!this.bookingHistory.length) {
            return `
                <div class="empty-tab">
                    <i class="fas fa-ticket-alt"></i>
                    <h3>No bookings yet</h3>
                    <p>Your ticket history will appear here once you make your first booking.</p>
                    <a href="index.html" class="btn btn-primary" style="display:inline-flex;margin-top:20px;">
                        <i class="fas fa-film"></i> Browse Movies
                    </a>
                </div>`;
        }

        return `
            <div class="bookings-list">
                ${this.bookingHistory.map(b => this.renderBookingRow(b)).join('')}
            </div>
        `;
    },

    renderBookingRow(b) {
        const showDate = new Date(b.showtimeDate);
        const isUpcoming = showDate >= new Date();
        const statusClass = isUpcoming ? 'upcoming' : 'past';
        const statusLabel = isUpcoming ? 'Upcoming' : 'Past';

        return `
            <div class="booking-row">
                <img src="${b.moviePoster || ''}" alt="${b.movieTitle}" class="booking-poster"
                     onerror="this.style.background='var(--ink)';this.src='';">
                <div class="booking-info">
                    <div class="booking-title">${b.movieTitle}</div>
                    <div class="booking-meta">
                        <div class="booking-meta-item">
                            <i class="far fa-calendar"></i>
                            <span>${b.showtimeFormatted}</span>
                        </div>
                        <div class="booking-meta-item">
                            <i class="fas fa-map-marker-alt"></i>
                            <span>${b.branchName}</span>
                        </div>
                        <div class="booking-meta-item">
                            <i class="fas fa-chair"></i>
                            <span>Seats: ${(b.seats || []).join(', ')}</span>
                        </div>
                    </div>
                    <span class="booking-ref">${b.bookingReference}</span>
                </div>
                <span class="booking-status ${statusClass}">${statusLabel}</span>
            </div>
        `;
    },

    renderSettings() {
        const u = this.user;
        return `
            <div class="settings-group">
                <div class="settings-group-title">
                    <i class="fas fa-user"></i>
                    Personal Information
                </div>
                <div class="settings-row">
                    <div>
                        <div class="settings-label">Full Name</div>
                        <div class="settings-sublabel">Your display name</div>
                    </div>
                    <div class="settings-value">${u.name || '—'}</div>
                </div>
                <div class="settings-row">
                    <div>
                        <div class="settings-label">Email Address</div>
                        <div class="settings-sublabel">Used for confirmations</div>
                    </div>
                    <div class="settings-value">${u.email || '—'}</div>
                </div>
                <div class="settings-row">
                    <div>
                        <div class="settings-label">Phone Number</div>
                        <div class="settings-sublabel">For booking updates</div>
                    </div>
                    <div class="settings-value">${u.phone || '—'}</div>
                </div>
            </div>

            <div class="settings-group">
                <div class="settings-group-title">
                    <i class="fas fa-bell"></i>
                    Notifications
                </div>
                <div class="settings-row">
                    <div>
                        <div class="settings-label">Email Notifications</div>
                        <div class="settings-sublabel">Booking confirmations, offers</div>
                    </div>
                    <div class="settings-value">Enabled</div>
                </div>
                <div class="settings-row">
                    <div>
                        <div class="settings-label">SMS Notifications</div>
                        <div class="settings-sublabel">Showtime reminders</div>
                    </div>
                    <div class="settings-value">Enabled</div>
                </div>
            </div>

            <div class="settings-group">
                <div class="settings-group-title">
                    <i class="fas fa-shield-alt"></i>
                    Security
                </div>
                <div class="settings-row">
                    <div>
                        <div class="settings-label">Password</div>
                        <div class="settings-sublabel">Last changed —</div>
                    </div>
                    <button class="btn btn-ghost" onclick="ProfilePage.changePassword()">
                        <i class="fas fa-key"></i> Change
                    </button>
                </div>
                <div class="settings-row">
                    <div>
                        <div class="settings-label">Two-Factor Authentication</div>
                        <div class="settings-sublabel">Extra security for your account</div>
                    </div>
                    <button class="btn btn-ghost" onclick="ProfilePage.enableTwoFactor()">
                        <i class="fas fa-lock"></i> Enable
                    </button>
                </div>
            </div>
        `;
    },

    setupTabs() {
        document.querySelectorAll('.profile-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.profile-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(`${tab.dataset.tab}Panel`).classList.add('active');
            });
        });
    },

    logout() {
        if (!confirm('Are you sure you want to sign out?')) return;
        SavannahStorage.logout();
        window.location.href = 'index.html';
    },

    changePassword() {
        this.toast('Password change coming soon');
    },

    enableTwoFactor() {
        this.toast('2FA setup coming soon');
    },

    toast(msg) {
        const el = document.createElement('div');
        el.className = 'toast';
        el.innerHTML = `<i class="fas fa-info-circle"></i> ${msg}`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 3000);
    }
};

document.addEventListener('DOMContentLoaded', () => ProfilePage.init());
</script>
</body>
</html>
